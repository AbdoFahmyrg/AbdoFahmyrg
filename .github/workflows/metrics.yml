name: Metrics
on:
  # Rebuild the image every day at 3:00 (Cairo time is UTC+2)
  schedule: [{cron: "0 1 * * *"}]
  # Lets you run it manually from the Actions tab
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKENN }}
          user: AbdoFahmyrg
          filename: github-metrics.svg
          template: classic
          config_display: large          # two-column layout like the example
          config_timezone: Africa/Cairo
          base: header, activity, community, repositories, metadata

          # 3D contributions calendar + streak
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # "Coding habits": commits per hour / per day charts
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_from: 200
          plugin_habits_days: 30

          # Most used languages bar
          plugin_languages: yes
          plugin_languages_ignored: html, css

          # "Mastered technologies and topics" icons (from your repo topics)
          plugin_topics: yes
          plugin_topics_mode: mastered
          plugin_topics_limit: 0

          # Achievements badges
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

          # Uncomment when your portfolio is live to show its PageSpeed scores:
          # plugin_pagespeed: yes
          # plugin_pagespeed_url: https://YOUR-PORTFOLIO-URL
